<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

<FilesMatch "\.env">
    Order allow,deny
    Deny from all
</FilesMatch>

ErrorLog /var/log/apache2/error.log
CustomLog /var/log/apache2/access.log combined

